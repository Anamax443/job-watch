name: Deploy

# Deploy Workeru z cloudu (GitHub CI) — nezávisle na lokálním PC.
# Potřebuje GitHub secret: CLOUDFLARE_API_TOKEN (oprávnění Workers + D1).
# Pozn.: database_id musí být vyplněné ve wrangler.toml.

# Auto-deploy na push do main (secret CLOUDFLARE_API_TOKEN je nastaven).
# Lze i ručně přes „Run workflow" (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Účet má víc memberships → bez explicitního ID by wrangler v CI mohl
          # padnout na výběru účtu. Account ID není citlivé.
          accountId: a37a36270aa2db7382f62912ba5a0130
          # Vstříkni commit + čas buildu, ať patička ukazuje reálnou verzi (ne "dev").
          command: deploy --var GIT_COMMIT:${{ github.sha }} --var BUILT_AT:${{ github.event.head_commit.timestamp }}
