name: Deploy

# Deploy Workeru z cloudu (GitHub CI) — nezávisle na lokálním PC.
# Potřebuje GitHub secret: CLOUDFLARE_API_TOKEN (oprávnění Workers + D1).
# Pozn.: database_id musí být vyplněné ve wrangler.toml.

# Auto-deploy na push do main (secret CLOUDFLARE_API_TOKEN je nastaven).
# Lze i ručně přes „Run workflow" (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Dva commity: kontrola verze promptu porovnává HEAD~1..HEAD.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      # Brána před nasazením: mezi „na GitHubu" a „v provozu" musí stát kontrola.
      # Testy nepotřebují Worker, D1 ani síť — čisté funkce (dedup, region, prefiltr,
      # normalizace odpovědi modelu, autorizace). Když spadnou, nenasazuje se.
      - run: npm test
      # Fáze F4 build předpisu: prompt je kód a nese verzi. Když se src/prompts.ts změní
      # a PROMPT_VERSION ne, brána spadne — jinak by v uložených bězích ležela dvě různá
      # znění promptu pod jedním číslem a změna chování by se nedala spárovat s příčinou.
      - run: npm run check:prompt
      # Evaluační sada nad reálnými inzeráty (evals/skorovani.json). Deterministická část
      # (prefiltr, kraj) běží vždy a je to plnohodnotná brána; modelová část potřebuje klíč,
      # takže se tady hlasitě přeskočí. Sada existuje kvůli chybě z 31. 8. 2026, kdy
      # zpřísnění prefiltru opřené o špatný SQL agregát vyhazovalo 16 reálných leadů.
      - run: npm run evals
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Účet má víc memberships → bez explicitního ID by wrangler v CI mohl
          # padnout na výběru účtu. Account ID není citlivé.
          accountId: a37a36270aa2db7382f62912ba5a0130
          # Vstříkni commit + čas buildu, ať patička ukazuje reálnou verzi (ne "dev").
          command: deploy --var GIT_COMMIT:${{ github.sha }} --var BUILT_AT:${{ github.event.head_commit.timestamp }}
