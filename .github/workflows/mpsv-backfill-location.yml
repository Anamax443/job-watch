name: MPSV backfill lokality

# Jednorázově (ručně) dotáhne lokalitu+kraj u už uložených MPSV inzerátů, které se dřív
# ukládaly s prázdnou lokalitou (locationOf četlo jen adresaText = null u ~99 % záznamů).
# Opravené řádky vynuluje skóre → příští běh je přeskóruje s korektním regionem.
# Běží v CI, protože plný export MPSV má ~184 MB. Spouští se přes „Run workflow".
# Potřebuje GitHub secret: CLOUDFLARE_API_TOKEN (Workers + D1, stejný jako deploy/seed/liveness).
on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Export MPSV řádků z D1
        run: npx wrangler d1 execute job-watch --remote --json --command "SELECT id, location, region FROM seen_jobs WHERE source='mpsv'" > mpsv_rows.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Odvoď lokalitu/kraj z plného exportu
        run: npm run mpsv:backfill # čte mpsv_rows.json → píše mpsv_backfill.sql
      - name: Zapiš opravy do D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 execute job-watch --remote --file=mpsv_backfill.sql
