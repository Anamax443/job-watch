<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JobWatch — Konzole</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="88">🔎</text></svg>'>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#e8eaed; --mut:#9aa3b2; --acc:#4f9cf9; --good:#3ecf8e; --bad:#ef6b73; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:16px; padding:16px 20px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0; }
  nav a { color:var(--acc); text-decoration:none; margin-right:14px; }
  main { padding:20px; }
  .bar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  select { background:var(--card); border:1px solid var(--line); color:var(--fg); border-radius:8px; padding:8px 11px; font:inherit; max-width:100%; }
  .pill { font-size:12px; color:var(--mut); }
  .dot { font-size:11px; }
  .live { color:var(--good); }
  label.chk { display:flex; align-items:center; gap:6px; color:var(--mut); font-size:13px; }
  button { background:transparent; border:1px solid var(--line); color:var(--fg); border-radius:8px; padding:7px 14px; cursor:pointer; font:inherit; }
  .meta { color:var(--mut); font-size:13px; margin-bottom:8px; }
  .term {
    background:#0a0c10; border:1px solid var(--line); border-radius:10px; padding:14px 16px;
    font-family:Consolas,Menlo,monospace; font-size:13px; line-height:1.65; color:#cfe8d8;
    white-space:pre-wrap; word-break:break-word; height:calc(100vh - 230px); min-height:280px;
    overflow:auto;
  }
  .term .err { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>🖥️ JobWatch — Konzole</h1>
  <nav><a href="/">Výsledky</a><a href="/settings">Nastavení</a><a href="/console">Konzole</a><a href="/how">Jak to funguje</a><a href="/docs">Dokumentace</a></nav>
</header>

<main>
  <div class="bar">
    <select id="runsel" title="Historie běhů"></select>
    <button id="refresh">Obnovit</button>
    <label class="chk"><input id="auto" type="checkbox" checked /> auto-refresh</label>
    <span id="live" class="pill"></span>
  </div>
  <div class="meta" id="meta"></div>
  <pre class="term" id="term">Načítám…</pre>
</main>

<script>
const $ = (s) => document.querySelector(s);
let runs = [];
let selectedId = null;     // id zvoleného běhu; null = sleduj nejnovější
let timer = null;

function fmtStats(s){
  if(!s) return '';
  try{ const o = typeof s==='string'?JSON.parse(s):s;
    return `staženo ${o.fetched} · kandidáti ${o.candidates} · skóre ${o.scored} · deanon ${o.enriched} · notif ${o.notified} · zdroje +${o.discovered}`;
  }catch(e){ return ''; }
}
function isStale(r){
  if(!r || r.finished_at) return false;
  try{ const t=new Date(r.started_at.replace(' ','T')+'Z').getTime(); return (Date.now()-t)>150000; }catch(e){ return false; }
}
function state(r){
  if(!r.finished_at) return isStale(r) ? {t:'⚠️ neodpovídá', cls:''} : {t:'⏳ probíhá', cls:'live'};
  return r.ok ? {t:'✅ hotovo', cls:''} : {t:'⚠️ skončeno', cls:''};
}

function fillSelector(){
  const sel = $('#runsel');
  sel.innerHTML = '';
  for(const r of runs){
    const st = state(r);
    const opt = document.createElement('option');
    opt.value = r.id;
    opt.textContent = `#${r.id} · ${r.started_at} · ${r.trigger} · ${st.t}`;
    sel.appendChild(opt);
  }
  const target = selectedId ?? (runs[0]?.id ?? null);
  if(target != null) sel.value = String(target);
}

function render(){
  const id = selectedId ?? runs[0]?.id;
  const r = runs.find((x) => String(x.id) === String(id));
  const term = $('#term');
  if(!r){ term.textContent = 'Zatím žádné běhy. Spusť běh na stránce Výsledky („Spustit teď").'; $('#meta').textContent=''; $('#live').textContent=''; return; }
  const st = state(r);
  const running = !r.finished_at && !isStale(r);
  $('#meta').textContent = `běh #${r.id} · ${st.t} · ${r.trigger} · ${r.started_at}${r.finished_at?' → '+r.finished_at:''} · ${fmtStats(r.stats)}`;
  $('#live').className = 'pill ' + st.cls;
  $('#live').textContent = running ? '● živě' : '';
  // zachovej pozici scrollu, pokud uživatel odscrolloval nahoru u běžícího běhu
  const atBottom = term.scrollTop + term.clientHeight >= term.scrollHeight - 24;
  term.textContent = r.log || '(prázdný log)';
  if(running && atBottom) term.scrollTop = term.scrollHeight;
}

async function load(){
  try{
    const res = await fetch('/api/runs');
    runs = (await res.json()).runs || [];
  }catch(e){ $('#term').textContent = '✗ nepodařilo se načíst /api/runs'; return; }
  fillSelector();
  render();
}

$('#runsel').onchange = (e) => {
  // ruční volba: pokud je to nejnovější, vrať se k „sleduj nejnovější"
  const v = e.target.value;
  selectedId = (runs[0] && String(runs[0].id) === v) ? null : v;
  render();
};
$('#refresh').onclick = load;
$('#auto').onchange = (e) => { setupTimer(e.target.checked); };

function setupTimer(on){
  if(timer){ clearInterval(timer); timer=null; }
  if(on) timer = setInterval(load, 3000);
}

load();
setupTimer(true);
</script>
<script src="footer.js"></script>
</body>
</html>
