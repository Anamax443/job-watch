<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JobWatch — Výsledky</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="88">🔎</text></svg>'>

<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#e8eaed; --mut:#9aa3b2; --acc:#4f9cf9; --good:#3ecf8e; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:16px; padding:16px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; }
  nav a { color:var(--acc); text-decoration:none; margin-right:14px; }
  .spacer { flex:1; }
  button { background:var(--acc); color:#fff; border:0; padding:8px 14px; border-radius:8px; cursor:pointer; font-size:14px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
  .filters { display:flex; gap:14px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; color:var(--mut); }
  .filters input[type=number] { width:70px; background:var(--card); border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:5px 8px; }
  .savemsg { color:var(--ok, #34d399); font-size:13px; }
  main { padding:16px 20px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:600; font-size:13px; }
  .score { font-weight:700; }
  .badge { font-size:11px; padding:2px 6px; border-radius:5px; background:#2a2f3a; color:var(--mut); }
  .badge.agency { background:#3a2a1a; color:#f0b35b; }
  .badge.rep { background:#16263a; color:#7fb6f0; }
  .orig { color:var(--good); font-size:13px; }
  .reason { color:var(--mut); font-size:13px; }
  a.link { color:var(--acc); text-decoration:none; }
  .empty { color:var(--mut); padding:40px 0; text-align:center; }
  #status { color:var(--mut); font-size:13px; }
  .runbox{margin:0 20px;border:1px solid var(--line);border-radius:10px;background:#0b1018;overflow:hidden;display:none}
  .runbox.show{display:block}
  .runhead{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
  .runhead .st{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
  .runhead .st.run{background:var(--acc);animation:bl 1s infinite}
  .runhead .st.ok{background:var(--good)} .runhead .st.err{background:#ef6b73}
  @keyframes bl{50%{opacity:.35}}
  .runhead .spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;display:none;margin-left:auto;flex:none}
  .runhead.running .spin{display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .runlog{margin:0;padding:10px 12px;max-height:230px;overflow:auto;font:12px/1.55 ui-monospace,Consolas,monospace;color:#cdd6e6;white-space:pre-wrap}
  .runmeta{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>🔎 JobWatch</h1>
  <nav><a href="/">Výsledky</a><a href="/settings">Nastavení</a><a href="/how">Jak to funguje</a><a href="/docs">Dokumentace</a></nav>
  <span class="spacer"></span>
  <span id="status"></span>
  <button id="stop" class="ghost" style="display:none">⏹ Zastavit</button>
  <button id="run" class="ghost">▶ Spustit teď</button>
</header>

<div class="filters">
  <label>Min. skóre <input id="minScore" type="number" min="0" max="100" value="0" /></label>
  <label><input id="agencyOnly" type="checkbox" /> jen agentury</label>
  <button id="refresh" class="ghost">Obnovit</button>
  <button id="saveFilters" class="ghost">Uložit</button>
  <span id="saveMsg" class="savemsg" hidden>✓ uloženo</span>
</div>

<section class="runbox" id="runbox">
  <div class="runhead" id="runhead">
    <span class="st" id="runst"></span><b>Stav běhu</b>
    <span class="runmeta" id="runmeta"></span>
    <span class="spin"></span>
  </div>
  <pre class="runlog" id="runlog"></pre>
</section>

<main>
  <table>
    <thead><tr>
      <th>Skóre</th><th>Pozice</th><th>Zaměstnavatel</th><th>Lokalita</th><th>Mzda</th><th>Zdroj</th><th></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" hidden>Zatím žádné výsledky. Spusť běh tlačítkem „Spustit teď".</div>
</main>

<script>
const $ = (s) => document.querySelector(s);
function salary(j){ if(!j.salary_from && !j.salary_to) return '—'; return `${j.salary_from??'?'}–${j.salary_to??'?'} Kč`; }
function esc(s){ return String(s??'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function load(){
  const min = $('#minScore').value || 0;
  const ag = $('#agencyOnly').checked ? '1' : '0';
  $('#status').textContent = 'Načítám…';
  const r = await fetch(`/api/jobs?minScore=${min}&agency=${ag}`);
  const { jobs } = await r.json();
  const tb = $('#rows'); tb.innerHTML = '';
  $('#empty').hidden = jobs.length > 0;
  for(const j of jobs){
    const tr = document.createElement('tr');
    const emp = j.real_employer
      ? `${esc(j.employer)} <span class="badge agency">agentura</span><br><span class="orig">🎯 ${esc(j.real_employer)}</span>`
      : `${esc(j.employer)}${j.is_agency ? ' <span class="badge agency">agentura</span>' : ''}`;
    tr.innerHTML = `
      <td class="score">${j.relevance ?? '—'}</td>
      <td>${esc(j.title)}${j.seen_count>1?` <span class="badge rep" title="objevilo se vícekrát v čase">↻ opakovaný ×${j.seen_count}</span>`:''}<div class="reason">${esc(j.reason ?? '')}</div></td>
      <td>${emp}</td>
      <td>${esc(j.location ?? '—')}</td>
      <td>${salary(j)}</td>
      <td><span class="badge">${esc((j.source||'').split(':')[0])}</span></td>
      <td>${j.url ? `<a class="link" href="${esc(j.url)}" target="_blank" rel="noopener">otevřít ↗</a>` : ''}</td>`;
    tb.appendChild(tr);
  }
  $('#status').textContent = `${jobs.length} pozic`;
}

$('#refresh').onclick = load;
$('#minScore').onchange = load;
$('#agencyOnly').onchange = load;
let saveMsgTimer;
$('#saveFilters').onclick = () => {
  localStorage.setItem('jw.minScore', $('#minScore').value);
  localStorage.setItem('jw.agencyOnly', $('#agencyOnly').checked ? '1' : '0');
  const msg = $('#saveMsg');
  msg.hidden = false;
  clearTimeout(saveMsgTimer);
  saveMsgTimer = setTimeout(() => { msg.hidden = true; }, 2000);
};
function fmtStats(s){
  if(!s) return '';
  try{ const o=typeof s==='string'?JSON.parse(s):s;
    return `staženo ${o.fetched} · kandidáti ${o.candidates} · skóre ${o.scored} · deanon ${o.enriched} · notif ${o.notified} · zdroje +${o.discovered}`;
  }catch(e){ return ''; }
}
function runStale(latest){
  if(!latest || latest.finished_at) return false;
  try{ const t=new Date(latest.started_at.replace(' ','T')+'Z').getTime(); return (Date.now()-t)>150000; }catch(e){ return false; }
}
async function loadRuns(){
  let runs=[];
  try{ const r=await fetch('/api/runs'); runs=(await r.json()).runs||[]; }catch(e){ return null; }
  const latest=runs[0];
  if(!latest){ $('#stop').style.display='none'; return null; }
  $('#runbox').classList.add('show');
  const stale=runStale(latest);
  const running=!latest.finished_at && !stale;
  $('#runhead').classList.toggle('running', running);
  $('#runst').className='st '+(running?'run':(latest.finished_at&&latest.ok?'ok':'err'));
  const state=running?'⏳ probíhá…':(!latest.finished_at?'⚠️ neodpovídá (limit) — klikni „Zastavit"':(latest.ok?'✅ hotovo':'⚠️ skončeno'));
  $('#runmeta').textContent=`${state} · ${latest.trigger} · ${latest.started_at}${latest.finished_at?' → '+latest.finished_at:''} · ${fmtStats(latest.stats)}`;
  const log=$('#runlog'); const atBottom=log.scrollTop+log.clientHeight>=log.scrollHeight-24;
  log.textContent=latest.log||'';
  if(atBottom) log.scrollTop=log.scrollHeight;
  $('#stop').style.display = latest.finished_at ? 'none' : '';
  latest._stale=stale;
  return latest;
}
$('#run').onclick = async () => {
  $('#run').disabled = true; $('#status').textContent = 'Spouštím…';
  await fetch('/api/run', { method:'POST' });
  loadRuns();
  let tries=0;
  const iv=setInterval(async () => {
    const latest=await loadRuns(); tries++;
    if((latest && (latest.finished_at || latest._stale)) || tries>120){
      clearInterval(iv); $('#run').disabled=false; $('#status').textContent='';
      load();
    }
  }, 1500);
};
$('#stop').onclick = async () => {
  $('#stop').disabled=true; $('#status').textContent='Zastavuji…';
  try{ await fetch('/api/run/stop',{method:'POST'}); }catch(e){}
  $('#stop').disabled=false; $('#status').textContent='';
  await loadRuns(); load();
};
const savedMin = localStorage.getItem('jw.minScore');
if (savedMin !== null) $('#minScore').value = savedMin;
const savedAgency = localStorage.getItem('jw.agencyOnly');
if (savedAgency !== null) $('#agencyOnly').checked = savedAgency === '1';
load();
loadRuns();
</script>
<script src="footer.js"></script>
</body>
</html>
