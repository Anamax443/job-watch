<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JobWatch — Výsledky</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="88">🔎</text></svg>'>

<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#e8eaed; --mut:#9aa3b2; --acc:#4f9cf9; --good:#3ecf8e; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:16px; padding:16px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; }
  nav a { color:var(--acc); text-decoration:none; margin-right:14px; }
  .spacer { flex:1; }
  button { background:var(--acc); color:#fff; border:0; padding:8px 14px; border-radius:8px; cursor:pointer; font-size:14px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
  .filters { display:flex; gap:14px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; color:var(--mut); }
  .filters input[type=number] { width:70px; background:var(--card); border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:5px 8px; }
  .filters select { background:var(--card); border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:5px 8px; }
  .savemsg { color:var(--ok, #34d399); font-size:13px; }
  main { padding:16px 20px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:600; font-size:13px; }
  .score { font-weight:700; }
  .badge { font-size:11px; padding:2px 6px; border-radius:5px; background:#2a2f3a; color:var(--mut); }
  .badge.agency { background:#3a2a1a; color:#f0b35b; }
  .badge.rep { background:#16263a; color:#7fb6f0; }
  .orig { color:var(--good); font-size:13px; }
  .reason { color:var(--mut); font-size:13px; }
  .stat { font-size:12px; padding:2px 7px; border-radius:5px; white-space:nowrap; }
  .stat.on { background:#16311f; color:var(--good); }
  .stat.off { background:#3a1c1e; color:#ef8f95; }
  .stat.unk { background:#2a2f3a; color:var(--mut); }
  .stat.pulled { background:#3a2f1a; color:#f0b35b; }
  .savedad { margin-top:6px; }
  .savedad summary { cursor:pointer; color:var(--acc); font-size:12px; }
  .savedad .adbody { margin-top:6px; padding:8px 10px; background:#0b1018; border:1px solid var(--line); border-radius:8px; color:#cdd6e6; font-size:13px; white-space:pre-wrap; max-height:280px; overflow:auto; }
  .contact { color:var(--mut); font-size:12px; margin-top:4px; line-height:1.35; }
  .contact a { color:var(--acc); text-decoration:none; }
  .reach { font-size:12px; margin-top:4px; color:var(--mut); }
  .reach a { color:var(--acc); text-decoration:none; }
  .titlelink { color:var(--fg); text-decoration:none; cursor:pointer; font-weight:600; }
  .titlelink:hover { color:var(--acc); text-decoration:underline; }
  .showad { display:inline-block; margin-top:6px; color:var(--acc); text-decoration:none; font-size:12px; cursor:pointer; }
  .showad:hover { text-decoration:underline; }
  .mut { color:var(--mut); }
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:100; overflow:auto; }
  .modal-backdrop[hidden] { display:none; }
  .modal { position:relative; background:var(--card); border:1px solid var(--line); border-radius:12px; max-width:820px; width:100%; padding:22px 26px; }
  .modal-close { position:absolute; top:12px; right:14px; background:transparent; border:1px solid var(--line); color:var(--fg); border-radius:8px; width:32px; height:32px; cursor:pointer; font-size:15px; padding:0; }
  .dtitle { font-size:20px; margin:0 34px 10px 0; }
  .dmeta { color:var(--mut); font-size:13.5px; margin-bottom:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .dscore { font-size:13px; color:var(--mut); margin-bottom:6px; }
  .dbody { white-space:pre-wrap; line-height:1.6; font-size:14.5px; margin:14px 0; padding-top:14px; border-top:1px solid var(--line); }
  .dlinks { border-top:1px solid var(--line); padding-top:12px; font-size:13px; }
  .dlinks a { color:var(--acc); text-decoration:none; }
  tr.dead td { opacity:.6; }
  a.link { color:var(--acc); text-decoration:none; }
  .empty { color:var(--mut); padding:40px 0; text-align:center; }
  #status { color:var(--mut); font-size:13px; }
  .runbox{margin:0 20px;border:1px solid var(--line);border-radius:10px;background:#0b1018;overflow:hidden;display:none}
  .runbox.show{display:block}
  .runhead{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
  .runhead .st{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
  .runhead .st.run{background:var(--acc);animation:bl 1s infinite}
  .runhead .st.ok{background:var(--good)} .runhead .st.err{background:#ef6b73}
  @keyframes bl{50%{opacity:.35}}
  .runhead .spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;display:none;margin-left:auto;flex:none}
  .runhead.running .spin{display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .runlog{margin:0;padding:10px 12px;max-height:230px;overflow:auto;font:12px/1.55 ui-monospace,Consolas,monospace;color:#cdd6e6;white-space:pre-wrap}
  .runmeta{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>🔎 JobWatch</h1>
  <nav><a href="/">Výsledky</a><a href="/settings">Nastavení</a><a href="/console">Konzole</a><a href="/how">Jak to funguje</a><a href="/docs">Dokumentace</a></nav>
  <span class="spacer"></span>
  <span id="status"></span>
  <button id="stop" class="ghost" style="display:none">⏹ Zastavit</button>
  <button id="run" class="ghost" title="Spustí běh a v dávkách doskóruje celé stažení (jeden běh stihne kvůli časovému stropu jen část). Zastavit lze tlačítkem ⏹.">▶ Spustit teď</button>
</header>

<div class="filters">
  <label>Min. skóre <input id="minScore" type="number" min="0" max="100" value="0" /></label>
  <label title="Zobrazit vše, jen na portálu, nebo jen stažené z portálu (VŘ ale může běžet dál)">Stav
    <select id="activeFilter">
      <option value="all">Vše</option>
      <option value="active">Na portálu</option>
      <option value="inactive">Staženo z portálu</option>
    </select>
  </label>
  <label><input id="agencyOnly" type="checkbox" /> jen agentury</label>
  <button id="refresh" class="ghost" title="Načíst výsledky znovu podle nastavených filtrů">Obnovit</button>
  <button id="saveFilters" class="ghost" title="Zapamatovat si tyto filtry v prohlížeči">Uložit</button>
  <span id="saveMsg" class="savemsg" hidden>✓ uloženo</span>
</div>

<section class="runbox" id="runbox">
  <div class="runhead" id="runhead">
    <span class="st" id="runst"></span><b>Stav běhu</b>
    <span class="runmeta" id="runmeta"></span>
    <span class="spin"></span>
  </div>
  <pre class="runlog" id="runlog"></pre>
</section>

<main>
  <table>
    <thead><tr>
      <th>Skóre</th><th>Pozice</th><th>Zaměstnavatel</th><th>Lokalita</th><th>Mzda</th><th>Zdroj</th><th>Stav</th><th></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" hidden>Zatím žádné výsledky. Spusť běh tlačítkem „Spustit teď".</div>
</main>

<div id="detail" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="Detail inzerátu">
    <button id="detailClose" class="modal-close" title="Zavřít (Esc)">✕</button>
    <div id="detailBody"></div>
  </div>
</div>

<script src="/index.js"></script>
<script src="footer.js"></script>
</body>
</html>
