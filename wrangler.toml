name = "job-watch"
main = "src/index.ts"
compatibility_date = "2026-01-01"
# VYPNUTO: workers.dev nejde chránit Cloudflare Accessem, takže dokud bylo zapnuté, šla
# všechna čtecí API (/api/settings s profilem/CV, /api/jobs s kontaktními osobami, /api/runs)
# vytáhnout bez přihlášení mimo Access. Jediná adresa je jobwatch.maxferit.cz (za Accessem).
workers_dev = false

# Denní běh: 07:00 SEČ / 06:00 UTC. MPSV publikuje přírůstky v pracovní dny.
[triggers]
crons = ["0 6 * * *"]

# Statické UI (Výsledky + Nastavení) servírované stejným Workerem.
[assets]
directory = "./public"
binding = "ASSETS"
# Worker běží jako první i pro statiku → bezpečnostní hlavičky (secure()) se přidají i k HTML.
run_worker_first = true
# /api/* řeší Worker, zbytek obslouží env.ASSETS.fetch (viz src/index.ts).

# Custom doména pro Cloudflare Access (workers.dev nelze chránit Accessem) — jediná cesta dovnitř.
[[routes]]
pattern = "jobwatch.maxferit.cz"
custom_domain = true

# D1 — stav, dedup, výsledky, nastavení.
# database_id doplň po `wrangler d1 create job-watch`.
[[d1_databases]]
binding = "DB"
database_name = "job-watch"
database_id = "09fc72b1-9595-4a8f-9cba-e1b463138cf7"

# Cloudflare Workers AI — free backend AI vrstvy (skórování). Data neopustí Cloudflare.
# Bez klíče = skórování jede zdarma; placený Claude je volitelný (viz AI_PROVIDER).
[ai]
binding = "AI"

# Cloudflare Email Sending — odesílání e-mailových notifikací z Workeru (bez SMTP, bez klíčů).
# Doména odesílatele (EMAIL_FROM) musí být onboardovaná: Dashboard → Email Service → Email Sending
# → Onboard Domain (maxferit.cz). Do té doby send() vrací E_SENDER_NOT_VERIFIED (mail se přeskočí).
[[send_email]]
name = "EMAIL"

# Necitlivé proměnné. Tajné klíče jdou přes `wrangler secret put ...` (viz .dev.vars.example).
[vars]
# AI backend „dle úhrady" (přebíjí ho volba v Nastavení → settings.aiProvider):
#   "" = podle serveru → ZDARMA Cloudflare Workers AI primárně (default „co má Cloudflare"),
#        placený Claude jen jako fallback / pro deanonymizaci (když je ANTHROPIC_API_KEY).
#   "workers-ai" = jen zdarma · "anthropic" = placený Claude · "off" = bez AI.
AI_PROVIDER = ""
# Modely placeného Claude backendu (skórování / deanonymizace). Free backend = viz src/ai.ts.
SCORE_MODEL = "claude-haiku-4-5"
ENRICH_MODEL = "claude-sonnet-4-6"
# Volitelné: kolik dní zpět maximálně dohánět přírůstky při prvním běhu / po výpadku.
MAX_INCREMENT_BACKFILL_DAYS = "7"
# Kolik nových zdrojů (personálek/firem) max. dynamicky proscreenovat za jeden běh (cost control).
MAX_DISCOVERY_PER_RUN = "5"
# Strop AI hodnocení na jeden běh — předvídatelná spotřeba backendu (Workers AI má zdarma
# 10 000 neuronů/den). Co se nevejde, počká ve frontě na další běh; uplatnění se loguje.
MAX_SCORES_PER_RUN = "150"
# Strop notifikací odeslaných z fronty na jeden běh (dohánění historie ať neudělá lavinu zpráv).
MAX_NOTIFY_FROM_QUEUE_PER_RUN = "10"
# Otevřené hledání „jako na Googlu" přes Serper.dev (rychlé). Funguje jen když je
# nastaven secret SERPER_API_KEY; jinak se web zdroj přeskočí. "false" = úplně vypnout.
WEB_SEARCH = "true"
# Odesílatel e-mailových notifikací (Cloudflare Email Sending). Doména musí být onboardovaná.
EMAIL_FROM = "jobwatch@maxferit.cz"
